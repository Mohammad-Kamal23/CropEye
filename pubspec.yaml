name: cropeye
description: "CropEye — Cloud-based Tomato Leaf Pest Detector"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # === Authentication ===
  local_auth: ^2.3.0

  # === Firebase (core + auth) ===
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0

  # === Animation & Visual FX ===
  flutter_animate: ^4.5.0
  animations: ^2.0.8
  graphx: ^1.0.14
  lottie: ^2.7.0

  # === Image & Camera Handling ===
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.0

  # === Data / Utilities ===
  shared_preferences: ^2.3.2
  provider: ^6.1.5
  intl: ^0.20.2
  http: ^1.2.2
  flutter_cache_manager: ^3.3.2
  vector_math: ^2.1.4

  # === Chat UI Enhancement (SAFE) ===
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/settings.jpg
    - assets/blog.jpg
    - assets/contact.jpg  
    - assets/portfolio.jpg
    - assets/about.jpg
    - assets/service.jpg
    - assets/Welcome_Screen2.jpg
    - assets/homepage.jpg
    - assets/welcome_screen.jpg
    - assets/hero_field2.jpg
